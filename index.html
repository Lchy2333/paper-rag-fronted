<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f6ef7" />
    <title>Maclaosty</title>
    <script>
      // 首帧前应用主题，避免暗色模式刷新时白屏闪烁
      ;(function () {
        try {
          var id = localStorage.getItem('prf_theme')
          if (id === 'light') id = 'purple-light'
          else if (id === 'dark') id = 'purple-dark'
          if (!id) id = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'purple-dark' : 'purple-light'
          var dark = /-dark$/.test(id)
          var accent = id.replace(/-(light|dark)$/, '') || 'purple'
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.setAttribute('data-accent', accent)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
