# paper-rag-fronted Nginx 配置
# 职责：① 托管前端静态文件 ② 反代 /api /health 到 agent（BFF，前端零直连 RAG）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大文件：对齐 rag 的 100MB 上限
    client_max_body_size 100m;

    # 前端路由 history 模式兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查 → agent（精确匹配，避免被静态文件规则吞掉）
    location = /health {
        proxy_pass http://agent:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # API → agent（对话/认证/文档管理/llm check 全走 agent）
    location /api/ {
        proxy_pass http://agent:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 对齐上传超时
    }
}
